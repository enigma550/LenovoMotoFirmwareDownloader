<section
  class="rounded-xl border p-5 transition-all duration-200 border-base bg-surface"
  [class.shadow-sm]="!store.isDark()"
>
  <h3
    class="text-base font-semibold text-fg-strong"
  >
    {{ 'CONNECTED.TITLE' | translate }}
  </h3>
  <p
    class="mt-1 text-sm text-fg-dim"
  >
    {{ 'CONNECTED.DESC' | translate }}
  </p>

  <button
    class="mt-4 w-full rounded-lg bg-accent px-4 py-2.5 text-sm font-semibold text-white transition-colors hover:bg-accent-hover"
    type="button"
    (click)="store.runConnectedLookup()"
  >
    {{ 'CONNECTED.RUN_LOOKUP' | translate }}
  </button>

  @if (store.connectedSummary()) {
    <div
      class="mt-4 rounded-lg border p-3 text-sm border-base text-fg"
      [class.bg-elevated]="store.isDark()"
      [class.bg-canvas]="!store.isDark()"
    >
      <span class="text-accent">→</span>
      {{ store.connectedSummary() }}
    </div>
  }
</section>
