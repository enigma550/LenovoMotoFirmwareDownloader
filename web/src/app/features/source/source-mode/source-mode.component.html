<div class="space-y-4">
  <!-- Source Selection Panel -->
  <section
    class="rounded-xl border p-5 transition-all duration-200 border-base bg-surface"
    [class.shadow-sm]="!store.isDark()"
  >
    <div class="flex items-center gap-2 text-accent">
      <span class="text-lg">📱</span>
      <span class="text-xs font-semibold uppercase tracking-wide">{{ 'SOURCE.TITLE' | translate }}</span>
    </div>

    <div class="mt-4 grid gap-2">
      <!-- Connected Device -->
      <button
        class="flex items-center gap-3 rounded-lg border px-4 py-3 text-left text-sm font-medium transition-all"
        [class.border-accent]="store.sourceMode() === 'connected'"
        [class.bg-accent-subtle]="store.sourceMode() === 'connected' && !store.isDark()"
        [class.bg-accent/10]="store.sourceMode() === 'connected' && store.isDark()"
        [class.text-accent]="store.sourceMode() === 'connected'"
        [class.border-base]="store.sourceMode() !== 'connected' && store.isDark()"
        [class.bg-elevated]="store.sourceMode() !== 'connected' && store.isDark()"
        [class.text-fg]="store.sourceMode() !== 'connected' && store.isDark()"
        [class.hover:border-strong]="
          store.sourceMode() !== 'connected' && store.isDark()
        "
        [class.border-base]="store.sourceMode() !== 'connected' && !store.isDark()"
        [class.bg-surface]="store.sourceMode() !== 'connected' && !store.isDark()"
        [class.text-fg]="store.sourceMode() !== 'connected' && !store.isDark()"
        [class.hover:border-strong]="
          store.sourceMode() !== 'connected' && !store.isDark()
        "
        type="button"
        (click)="store.setSourceMode('connected')"
      >
        <span
          class="flex h-5 w-5 shrink-0 items-center justify-center rounded-full border-2"
          [class.border-accent]="store.sourceMode() === 'connected'"
          [class.border-strong]="store.sourceMode() !== 'connected' && store.isDark()"
          [class.border-strong]="store.sourceMode() !== 'connected' && !store.isDark()"
        >
          @if (store.sourceMode() === 'connected') {
            <span class="h-2 w-2 rounded-full bg-accent"></span>
          }
        </span>
        <span>
          <span class="block">{{ 'SOURCE.CONNECTED' | translate }}</span>
          <span
            class="block text-xs text-fg-dim"
            >{{ 'SOURCE.CONNECTED_VIA_ADB' | translate }}</span
          >
        </span>
      </button>

      <!-- Model Catalog -->
      <button
        class="flex items-center gap-3 rounded-lg border px-4 py-3 text-left text-sm font-medium transition-all"
        [class.border-accent]="store.sourceMode() === 'catalog'"
        [class.bg-accent-subtle]="store.sourceMode() === 'catalog' && !store.isDark()"
        [class.bg-accent/10]="store.sourceMode() === 'catalog' && store.isDark()"
        [class.text-accent]="store.sourceMode() === 'catalog'"
        [class.border-base]="store.sourceMode() !== 'catalog' && store.isDark()"
        [class.bg-elevated]="store.sourceMode() !== 'catalog' && store.isDark()"
        [class.text-fg]="store.sourceMode() !== 'catalog' && store.isDark()"
        [class.hover:border-strong]="store.sourceMode() !== 'catalog' && store.isDark()"
        [class.border-base]="store.sourceMode() !== 'catalog' && !store.isDark()"
        [class.bg-surface]="store.sourceMode() !== 'catalog' && !store.isDark()"
        [class.text-fg]="store.sourceMode() !== 'catalog' && !store.isDark()"
        [class.hover:border-strong]="
          store.sourceMode() !== 'catalog' && !store.isDark()
        "
        type="button"
        (click)="store.setSourceMode('catalog')"
      >
        <span
          class="flex h-5 w-5 shrink-0 items-center justify-center rounded-full border-2"
          [class.border-accent]="store.sourceMode() === 'catalog'"
          [class.border-strong]="store.sourceMode() !== 'catalog' && store.isDark()"
          [class.border-strong]="store.sourceMode() !== 'catalog' && !store.isDark()"
        >
          @if (store.sourceMode() === 'catalog') {
            <span class="h-2 w-2 rounded-full bg-accent"></span>
          }
        </span>
        <span>{{ 'SOURCE.CATALOG' | translate }}</span>
      </button>
    </div>
  </section>

  <!-- Workspace Panel -->
  <section
    class="rounded-xl border p-5 transition-all duration-200 border-base bg-surface"
    [class.shadow-sm]="!store.isDark()"
  >
    <div class="flex items-center gap-2">
      <span class="text-lg">📂</span>
      <span
        class="text-xs font-semibold uppercase tracking-wide text-fg-dim"
        >{{ 'WORKSPACE.TITLE' | translate }}</span
      >
    </div>

    <div class="mt-4 grid gap-2">
      <!-- Downloads -->
      <button
        class="flex items-center gap-3 rounded-lg border px-4 py-3 text-left text-sm font-medium transition-all"
        [class.border-accent]="store.sourceMode() === 'downloads'"
        [class.bg-accent-subtle]="store.sourceMode() === 'downloads' && !store.isDark()"
        [class.bg-accent/10]="store.sourceMode() === 'downloads' && store.isDark()"
        [class.text-accent]="store.sourceMode() === 'downloads'"
        [class.border-base]="store.sourceMode() !== 'downloads' && store.isDark()"
        [class.bg-elevated]="store.sourceMode() !== 'downloads' && store.isDark()"
        [class.text-fg]="store.sourceMode() !== 'downloads' && store.isDark()"
        [class.hover:border-strong]="
          store.sourceMode() !== 'downloads' && store.isDark()
        "
        [class.border-base]="store.sourceMode() !== 'downloads' && !store.isDark()"
        [class.bg-surface]="store.sourceMode() !== 'downloads' && !store.isDark()"
        [class.text-fg]="store.sourceMode() !== 'downloads' && !store.isDark()"
        [class.hover:border-strong]="
          store.sourceMode() !== 'downloads' && !store.isDark()
        "
        type="button"
        (click)="store.setSourceMode('downloads')"
      >
        <span
          class="flex h-5 w-5 shrink-0 items-center justify-center rounded-full border-2"
          [class.border-accent]="store.sourceMode() === 'downloads'"
          [class.border-strong]="store.sourceMode() !== 'downloads' && store.isDark()"
          [class.border-strong]="store.sourceMode() !== 'downloads' && !store.isDark()"
        >
          @if (store.sourceMode() === 'downloads') {
            <span class="h-2 w-2 rounded-full bg-accent"></span>
          }
        </span>
        <span>{{ 'WORKSPACE.DOWNLOADS' | translate }}</span>
      </button>

      <!-- Backup/Restore -->
      <button
        class="flex items-center gap-3 rounded-lg border px-4 py-3 text-left text-sm font-medium transition-all"
        [class.border-accent]="store.sourceMode() === 'backup-restore'"
        [class.bg-accent-subtle]="store.sourceMode() === 'backup-restore' && !store.isDark()"
        [class.bg-accent/10]="store.sourceMode() === 'backup-restore' && store.isDark()"
        [class.text-accent]="store.sourceMode() === 'backup-restore'"
        [class.border-base]="store.sourceMode() !== 'backup-restore' && store.isDark()"
        [class.bg-elevated]="store.sourceMode() !== 'backup-restore' && store.isDark()"
        [class.text-fg]="store.sourceMode() !== 'backup-restore' && store.isDark()"
        [class.hover:border-strong]="
          store.sourceMode() !== 'backup-restore' && store.isDark()
        "
        [class.border-base]="store.sourceMode() !== 'backup-restore' && !store.isDark()"
        [class.bg-surface]="store.sourceMode() !== 'backup-restore' && !store.isDark()"
        [class.text-fg]="store.sourceMode() !== 'backup-restore' && !store.isDark()"
        [class.hover:border-strong]="
          store.sourceMode() !== 'backup-restore' && !store.isDark()
        "
        type="button"
        (click)="store.setSourceMode('backup-restore')"
      >
        <span
          class="flex h-5 w-5 shrink-0 items-center justify-center rounded-full border-2"
          [class.border-accent]="store.sourceMode() === 'backup-restore'"
          [class.border-strong]="
            store.sourceMode() !== 'backup-restore' && store.isDark()
          "
          [class.border-strong]="
            store.sourceMode() !== 'backup-restore' && !store.isDark()
          "
        >
          @if (store.sourceMode() === 'backup-restore') {
            <span class="h-2 w-2 rounded-full bg-accent"></span>
          }
        </span>
        <span>{{ 'WORKSPACE.BACKUP_RESTORE' | translate }}</span>
      </button>

      <!-- App Store -->
      <button
        class="flex items-center gap-3 rounded-lg border px-4 py-3 text-left text-sm font-medium transition-all"
        [class.border-accent]="store.sourceMode() === 'app-store'"
        [class.bg-accent-subtle]="store.sourceMode() === 'app-store' && !store.isDark()"
        [class.bg-accent/10]="store.sourceMode() === 'app-store' && store.isDark()"
        [class.text-accent]="store.sourceMode() === 'app-store'"
        [class.border-base]="store.sourceMode() !== 'app-store' && store.isDark()"
        [class.bg-elevated]="store.sourceMode() !== 'app-store' && store.isDark()"
        [class.text-fg]="store.sourceMode() !== 'app-store' && store.isDark()"
        [class.hover:border-strong]="
          store.sourceMode() !== 'app-store' && store.isDark()
        "
        [class.border-base]="store.sourceMode() !== 'app-store' && !store.isDark()"
        [class.bg-surface]="store.sourceMode() !== 'app-store' && !store.isDark()"
        [class.text-fg]="store.sourceMode() !== 'app-store' && !store.isDark()"
        [class.hover:border-strong]="
          store.sourceMode() !== 'app-store' && !store.isDark()
        "
        type="button"
        (click)="store.setSourceMode('app-store')"
      >
        <span
          class="flex h-5 w-5 shrink-0 items-center justify-center rounded-full border-2"
          [class.border-accent]="store.sourceMode() === 'app-store'"
          [class.border-strong]="store.sourceMode() !== 'app-store' && store.isDark()"
          [class.border-strong]="store.sourceMode() !== 'app-store' && !store.isDark()"
        >
          @if (store.sourceMode() === 'app-store') {
            <span class="h-2 w-2 rounded-full bg-accent"></span>
          }
        </span>
        <span class="block">{{ 'WORKSPACE.APP_STORE' | translate }}</span>
      </button>

      <!-- About -->
      <div
        class="mt-2 border-t pt-3 border-base"
      >
        <button
          class="flex w-full items-center gap-3 rounded-lg border px-4 py-3 text-left text-sm font-medium transition-all"
          [class.border-accent]="store.sourceMode() === 'about'"
          [class.bg-accent-subtle]="store.sourceMode() === 'about' && !store.isDark()"
          [class.bg-accent/10]="store.sourceMode() === 'about' && store.isDark()"
          [class.text-accent]="store.sourceMode() === 'about'"
          [class.border-base]="store.sourceMode() !== 'about' && store.isDark()"
          [class.bg-elevated]="store.sourceMode() !== 'about' && store.isDark()"
          [class.text-fg]="store.sourceMode() !== 'about' && store.isDark()"
          [class.hover:border-strong]="store.sourceMode() !== 'about' && store.isDark()"
          [class.border-base]="store.sourceMode() !== 'about' && !store.isDark()"
          [class.bg-surface]="store.sourceMode() !== 'about' && !store.isDark()"
          [class.text-fg]="store.sourceMode() !== 'about' && !store.isDark()"
          [class.hover:border-strong]="
            store.sourceMode() !== 'about' && !store.isDark()
          "
          type="button"
          (click)="store.setSourceMode('about')"
        >
          <span
            class="flex h-5 w-5 shrink-0 items-center justify-center rounded-full border-2"
            [class.border-accent]="store.sourceMode() === 'about'"
            [class.border-strong]="store.sourceMode() !== 'about' && store.isDark()"
            [class.border-strong]="store.sourceMode() !== 'about' && !store.isDark()"
          >
            @if (store.sourceMode() === 'about') {
              <span class="h-2 w-2 rounded-full bg-accent"></span>
            }
          </span>
          <span>{{ 'WORKSPACE.ABOUT' | translate }}</span>
        </button>
      </div>
    </div>
  </section>
</div>
