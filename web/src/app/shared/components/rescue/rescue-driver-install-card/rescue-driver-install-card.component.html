<div
  class="space-y-3 rounded-lg border p-3 border-base"
  [class.bg-elevated]="isDark()"
  [class.bg-canvas]="!isDark()"
>
  <p
    class="text-sm font-semibold text-fg-strong"
  >
    {{ title() }}
  </p>
  <p class="text-xs text-fg-dim"  >
    {{ description() }}
  </p>
  <div>
    <app-rescue-dialog-button
      [label]="buttonLabel()"
      [isDark]="isDark()"
      [disabled]="buttonDisabled()"
      variant="secondary"
      (clicked)="onInstall()"
    />
  </div>
  @if (installed() && installedNote()) {
    <p class="text-xs text-success">
      ✓ {{ installedNote() }}
    </p>
  }
</div>
