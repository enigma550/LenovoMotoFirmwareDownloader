@if (shouldShow()) {
  <section
    #consoleSection
    class="mt-4 rounded-xl border p-4 border-base bg-surface"
  >
    <div class="mb-3 flex items-center justify-between gap-2">
      <p
        class="text-sm font-semibold text-fg-strong"
      >
        {{ title() }}
      </p>
      <div class="flex items-center gap-2">
        <app-ui-action-button
          [label]="'CONSOLE.CANCEL' | translate"
          [isDark]="isDark()"
          variant="danger"
          appearance="outline"
          [disabled]="!canCancelCurrentAction()"
          (clicked)="requestCancelCurrentAction()"
        />
        <app-ui-action-button
          [label]="'CONSOLE.COPY' | translate"
          [isDark]="isDark()"
          variant="neutral"
          appearance="outline"
          (clicked)="copyConsoleToClipboard()"
        />
        <app-ui-action-button
          [label]="'CONSOLE.CLEAR' | translate"
          [isDark]="isDark()"
          variant="neutral"
          appearance="outline"
          (clicked)="clearConsole()"
        />
        @if (currentReportData()) {
          <app-ui-action-button
            [label]="'REPORT.BTN' | translate"
            [isDark]="isDark()"
            variant="primary"
            appearance="outline"
            (clicked)="openReportModal()"
          />
        }
      </div>
    </div>
    <div
      class="h-56 overflow-hidden rounded-lg border border-base"
      (wheel)="onConsoleWheel($event)"
    >
      <ng-terminal #flashTerminal [xtermOptions]="terminalOptions()" />
    </div>
  </section>

  <app-service-report-modal
    [isOpen]="showReportModal()"
    [isDark]="isDark()"
    [report]="currentReportData()"
    (close)="closeReportModal()"
  />
}
