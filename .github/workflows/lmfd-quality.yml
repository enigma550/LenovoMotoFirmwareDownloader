name: Quality

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    name: Architecture, typecheck, lint and tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.2"

      - name: Install root dependencies
        run: bun install --frozen-lockfile

      - name: Install web dependencies
        run: |
          cd web
          bun install --frozen-lockfile

      - name: Architecture checks (layers + cycles)
        run: bun run arch:check

      - name: Typecheck (runtime + web)
        run: bun run tsc

      - name: Biome
        run: bun run biome:ci

      - name: Tests
        run: bun test

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.2"

      - name: Audit root dependencies
        run: bun audit || true

      - name: Audit web dependencies
        run: |
          cd web
          bun audit || true
