name: Resolve Version Test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  resolve:
    name: Resolve Version Test (${{ matrix.channel }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        channel: [stable, canary, dev]

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.2"

      - name: Install dependencies
        shell: bash
        run: bun install --frozen-lockfile

      - name: Run resolve-version
        shell: bash
        env:
          CHANNEL: ${{ matrix.channel }}
        run: bun tooling/release/resolve-version-test.ts "$CHANNEL"
